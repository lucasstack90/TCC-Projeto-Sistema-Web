<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244438">
  <script>
    /* Aplica o tema salvo antes de desenhar a página (evita piscar o tema claro). */
    try {
      const t = localStorage.getItem('tema');
      const escuro = t ? t === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', escuro);
      document.documentElement.setAttribute('data-bs-theme', escuro ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <meta name="description" content="Acesse o PAWSAFE, sistema de gestão e proteção animal.">
  <link rel="icon" type="image/svg+xml" href="../Img/pata.svg">
  <title>Entrar | PAWSAFE</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/tema.css">
  <link rel="stylesheet" href="../CSS/base.css">
  <link rel="stylesheet" href="../CSS/publico.css">
  <link rel="stylesheet" href="../CSS/login.css">
</head>
<body class="public-page login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="public-brand">
        <span class="brand-mark"><svg class="paw-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="currentColor"><ellipse cx="9.1" cy="6.6" rx="2" ry="2.6" transform="rotate(-10 9.1 6.6)"/><ellipse cx="14.9" cy="6.6" rx="2" ry="2.6" transform="rotate(10 14.9 6.6)"/><ellipse cx="4.9" cy="11.2" rx="1.8" ry="2.3" transform="rotate(-30 4.9 11.2)"/><ellipse cx="19.1" cy="11.2" rx="1.8" ry="2.3" transform="rotate(30 19.1 11.2)"/><path d="M12 12.4c-2.8 0-5.6 3.1-5.6 5.7 0 1.6 1.2 2.6 2.6 2.6 1.3 0 2-.7 3-.7s1.7.7 3 .7c1.4 0 2.6-1 2.6-2.6 0-2.6-2.8-5.7-5.6-5.7z"/></g></svg></span>
        <span class="brand-copy"><strong>PAWSAFE</strong><small>Gestão e proteção animal</small></span>
      </div>

      <div class="login-heading">
        <h1 id="loginTitle">Bem-vindo de volta!</h1>
        <p>Entre na sua conta para continuar cuidando de quem mais precisa.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail (Gmail)</label>
          <div class="input-wrap">
            <i class="bi bi-envelope" aria-hidden="true"></i>
            <input class="form-control" id="email" name="email" type="email" placeholder="seunome@gmail.com" autocomplete="username" required aria-describedby="emailError">
          </div>
          <div class="invalid-feedback" id="emailError">Informe um endereço de e-mail válido.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="input-wrap password-wrap">
            <i class="bi bi-lock" aria-hidden="true"></i>
            <input class="form-control" id="password" name="password" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="current-password" required minlength="6" aria-describedby="passwordError">
            <button class="password-toggle" id="togglePassword" type="button" aria-label="Mostrar senha" aria-pressed="false"><i class="bi bi-eye"></i></button>
          </div>
          <div class="invalid-feedback" id="passwordError">A senha deve ter pelo menos 6 caracteres.</div>
        </div>

        <div class="login-options">
          <label class="remember-option"><input type="checkbox" id="rememberMe"> Manter conectado</label>
          <a href="#ajuda" id="helpLink">Precisa de ajuda?</a>
        </div>

        <div class="alert login-alert d-none" id="loginMessage" role="alert"></div>
        <button class="btn btn-green w-100 btn-entrar" type="submit">Entrar no sistema <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
        <p class="login-note"><i class="bi bi-shield-lock" aria-hidden="true"></i> Seus dados devem ser mantidos em segurança.</p>
      </form>
    </section>

    <footer class="login-footer"><span>© <span id="year"></span> PAWSAFE</span><span aria-hidden="true">·</span><span>Feito para proteger vidas</span></footer>
  </main>
  <script src="../js/tema.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
